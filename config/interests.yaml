# Your interest profile.  Used for keyword scoring now; the same text
# becomes the LLM's relevance prompt later.

profile: >
  Practical security work (exploited CVEs, breaches, DFIR, malware, bug bounty),
  AI and LLM tooling for developers, Android and mobile development,
  Indian markets and major global business events, and significant
  India / world news.

# NOTE: these keys MUST match the category names used in feeds.yaml.
# A `cybersecurity:` key survived here after the categories were split into
# cyber_attacks and cyber_tools, so for a long time it matched nothing and
# every security keyword was dead config — security stories scored the bare
# category_base of 12 while markets and india_world stories scored up to 100.
# Interest carries the heaviest weight (0.45), so security was losing ~40
# blend points against routine news, and within the cyber sections ranking
# collapsed to trust+corroboration alone.
boost:
  cyber_attacks: ["actively exploited", "exploited in the wild", "zero-day",
                  "0-day", "KEV", "ransomware", "breach", "CVE-", "RCE",
                  "privilege escalation", "supply chain", "APT", "malware",
                  "data leak", "patch tuesday", "PoC", "unauthenticated",
                  "pre-auth", "backdoor", "infostealer", "botnet",
                  "critical vulnerability", "emergency patch"]
  cyber_tools:   ["open source", "github", "released", "toolkit", "framework",
                  "scanner", "detection rule", "sigma", "yara", "burp",
                  "nuclei", "writeup", "bug bounty", "how i found",
                  "exploit chain", "proof of concept", "DFIR", "forensics",
                  "threat hunting", "red team", "purple team", "tradecraft"]
  tech_ai:       ["Claude", "Anthropic", "GPT", "Gemini", "LLM", "open source model",
                  "agent", "benchmark", "Android", "Kotlin", "developer tool", "API"]
  markets:       ["RBI", "Sensex", "Nifty", "IPO", "funding round", "acquisition",
                  "layoffs", "inflation", "rate cut", "earnings"]
  india_world:   ["India", "Supreme Court", "parliament", "election", "policy",
                  "sanctions", "conflict", "summit"]

# Terms that make a story CRITICAL on their own, regardless of blend score.
# Kept deliberately short: if everything is critical, nothing is.
critical_signals:
  - "actively exploited"
  - "exploited in the wild"
  - "emergency patch"
  - "out-of-band patch"
  - "added to the kev"
  - "known exploited vulnerabilities catalog"
  - "unauthenticated rce"
  - "supply chain compromise"
  - "mass exploitation"

# Matched as substrings against title + blurb. Vendor marketing wears news
# clothing — "[Virtual Event] What Every Enterprise Should Know About Securing
# Cloud Assets in the Age of AI" is a webinar signup, published by a real
# security outlet, and it reached the page looking exactly like reporting.
mute: ["horoscope", "sponsored", "deal of the day", "coupon", "giveaway",
       "best laptops under", "top 10 gadgets", "casino", "betting",
       "[virtual event]", "[webinar]", "[sponsored]", "[whitepaper]",
       "[podcast]", "[ebook]", "register now", "save your seat",
       "reserve your spot", "sign up today", "watch on demand",
       "download the report", "request a demo", "book a demo"]
