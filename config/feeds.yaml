# Feed registry.  category -> list of sources.
# tier:  A = wire/primary/official   B = established outlet   C = aggregator/blog
# flags: primary: true      the feed IS the official artifact (CISA, vendor PSIRT)
#        aggregator: true   link is a redirect stub, not the article itself
#
# Categories are the sections on the site. They are weighted toward what gets
# read here: new releases and how to use them, new attacks, new tools.

# --- New attacks, exploits, breaches, advisories ---------------------------
cyber_attacks:
  - {name: "CISA Advisories",      url: "https://www.cisa.gov/cybersecurity-advisories/all.xml",      tier: A, primary: true}
  - {name: "CISA News",            url: "https://www.cisa.gov/news.xml",                              tier: A, primary: true}
  - {name: "BleepingComputer",     url: "https://www.bleepingcomputer.com/feed/",                     tier: B}
  - {name: "The Hacker News",      url: "https://feeds.feedburner.com/TheHackersNews",                tier: B}
  - {name: "Krebs on Security",    url: "https://krebsonsecurity.com/feed/",                          tier: B}
  - {name: "Google Project Zero",  url: "https://googleprojectzero.blogspot.com/feeds/posts/default", tier: A, primary: true, window_hours: 720}
  - {name: "SANS ISC Diary",       url: "https://isc.sans.edu/rssfeed_full.xml",                      tier: A}
  - {name: "Unit42",               url: "https://unit42.paloaltonetworks.com/feed/",                  tier: B}
  - {name: "Securelist",           url: "https://securelist.com/feed/",                               tier: B}
  - {name: "DarkReading",          url: "https://www.darkreading.com/rss.xml",                        tier: B}
  - {name: "Cisco Talos",         url: "https://feeds.feedburner.com/feedburner/Talos",              tier: B}
  - {name: "WeLiveSecurity",      url: "https://www.welivesecurity.com/en/rss/feed/",                tier: B}
  - {name: "Malwarebytes Labs",   url: "https://www.malwarebytes.com/blog/feed/index.xml",           tier: B}

  # --- Google News topic scans -------------------------------------------
  # Viable now that redirect tokens resolve to real publisher URLs (see
  # pipeline/gnews.py). These cast a much wider net than any single outlet:
  # one query returned 53 ransomware stories where the dedicated feeds had 3.
  # tier C because a search result is unvetted; the publisher is read from
  # the title so clustering and outlet-counting still see the true source.
  - {name: "GN Zero-day watch", url: "https://news.google.com/rss/search?q=zero-day+OR+%22actively+exploited%22+vulnerability+when%3A4d&hl=en-US&gl=US&ceid=US%3Aen", tier: C, aggregator: true}
  - {name: "GN Ransomware watch", url: "https://news.google.com/rss/search?q=ransomware+attack+when%3A4d&hl=en-US&gl=US&ceid=US%3Aen", tier: C, aggregator: true}
  - {name: "GN Breach watch", url: "https://news.google.com/rss/search?q=%22data+breach%22+OR+%22data+leak%22+when%3A4d&hl=en-US&gl=US&ceid=US%3Aen", tier: C, aggregator: true}
  - {name: "GN CVE watch", url: "https://news.google.com/rss/search?q=CVE+critical+patch+advisory+when%3A4d&hl=en-US&gl=US&ceid=US%3Aen", tier: C, aggregator: true}
  - {name: "GN APT watch", url: "https://news.google.com/rss/search?q=%22threat+actor%22+OR+APT+campaign+malware+when%3A4d&hl=en-US&gl=US&ceid=US%3Aen", tier: C, aggregator: true}

# --- New tools, techniques, tradecraft, how-to ----------------------------
cyber_tools:
  - {name: "Rapid7 Blog",          url: "https://blog.rapid7.com/rss/",                               tier: B}
  - {name: "Schneier on Security", url: "https://www.schneier.com/feed/atom/",                        tier: B}
  - {name: "PortSwigger Research", url: "https://portswigger.net/research/rss",                       tier: A, window_hours: 720}
  - {name: "Trail of Bits",        url: "https://blog.trailofbits.com/feed/",                         tier: B, window_hours: 504}
  # GitHub tool discovery is not RSS — see the `github:` block in settings.yaml
  - {name: "Elastic Security Labs", url: "https://www.elastic.co/security-labs/rss/feed.xml",        tier: B}
  - {name: "GitHub Security Lab", url: "https://github.blog/tag/github-security-lab/feed/",          tier: A}
  - {name: "OALabs Research",     url: "https://research.openanalysis.net/feed.xml",                 tier: B, window_hours: 720}

  # --- Bug bounty and exploit writeups -----------------------------------
  # window_hours overrides the category window. These labs publish once or
  # twice a MONTH; under the 168h category window every one of them returned
  # zero items despite the feeds working. A month-old teardown of a pre-auth
  # RCE has not stopped being worth reading.
  #
  # Measured cadence 2026-08-24 (newest post age): Sonar 12 items inside 30d,
  # PortSwigger 3, Trail of Bits 2, watchTowr 1, Include Security 1;
  # Doyensec 68d, OALabs 69d, Project Zero 103d, Assetnote 949d.
  # The last four contribute nothing most weeks and that is fine — they cost
  # one HTTP request and appear the day they publish. Assetnote looks
  # abandoned rather than slow; kept only because it is free to keep.
  # "How they did it" content: disclosed bugs with the methodology attached,
  # not just the announcement that a bug existed. All probed live 2026-08-24.
  - {name: "watchTowr Labs",      url: "https://labs.watchtowr.com/rss/",                       tier: A, window_hours: 720}
  - {name: "Assetnote Research",  url: "https://blog.assetnote.io/feed.xml",                    tier: A, window_hours: 720}
  - {name: "Doyensec",            url: "https://blog.doyensec.com/atom.xml",                    tier: A, window_hours: 720}
  - {name: "Include Security",    url: "https://blog.includesecurity.com/feed/",                tier: B, window_hours: 720}
  - {name: "Sonar Research",      url: "https://www.sonarsource.com/blog/rss.xml",              tier: B, window_hours: 720}
  - {name: "InfoSec Write-ups",   url: "https://infosecwriteups.com/feed",                      tier: C}
  - {name: "Medium bug bounty",   url: "https://medium.com/feed/tag/bug-bounty",                tier: C}
  - {name: "Medium pentesting",   url: "https://medium.com/feed/tag/penetration-testing",       tier: C}
  - {name: "Chromium Releases",   url: "https://chromereleases.googleblog.com/atom.xml",        tier: A, primary: true}
  - {name: "GN Bug bounty",       url: "https://news.google.com/rss/search?q=%22bug+bounty%22+OR+%22vulnerability+disclosure%22+reward+researcher+when%3A7d&hl=en-US&gl=US&ceid=US%3Aen", tier: C, aggregator: true}
  - {name: "GN Exploit writeup",  url: "https://news.google.com/rss/search?q=%22proof+of+concept%22+exploit+writeup+vulnerability+chain+when%3A7d&hl=en-US&gl=US&ceid=US%3Aen", tier: C, aggregator: true}

  # --- Google News topic scans -------------------------------------------
  # Viable now that redirect tokens resolve to real publisher URLs (see
  # pipeline/gnews.py). These cast a much wider net than any single outlet:
  # one query returned 53 ransomware stories where the dedicated feeds had 3.
  # tier C because a search result is unvetted; the publisher is read from
  # the title so clustering and outlet-counting still see the true source.
  - {name: "GN Security tools", url: "https://news.google.com/rss/search?q=%22open+source%22+security+tool+release+github+when%3A4d&hl=en-US&gl=US&ceid=US%3Aen", tier: C, aggregator: true}
  - {name: "GN Offensive tools", url: "https://news.google.com/rss/search?q=pentest+OR+%22red+team%22+OR+exploit+tool+release+when%3A4d&hl=en-US&gl=US&ceid=US%3Aen", tier: C, aggregator: true}
  - {name: "GN DFIR tools", url: "https://news.google.com/rss/search?q=DFIR+OR+%22digital+forensics%22+OR+%22incident+response%22+tool+when%3A4d&hl=en-US&gl=US&ceid=US%3Aen", tier: C, aggregator: true}
  - {name: "GN Detection eng", url: "https://news.google.com/rss/search?q=%22detection+engineering%22+OR+%22threat+hunting%22+OR+sigma+rules+when%3A4d&hl=en-US&gl=US&ceid=US%3Aen", tier: C, aggregator: true}

