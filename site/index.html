<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Newsdesk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#faf9f6; --card:#fff; --ink:#1c1b19; --ink2:#3d3b37; --muted:#6f6c66;
  --line:#e6e3dc; --line2:#d5d1c7; --accent:#8a5a2b;
  /* --imp was #a8701a at 3.99:1 and --minor #8f8b83 at 3.22:1 on this
     background: both under the 4.5:1 AA floor for the small, bold text
     they are used on. Darkened to clear it while keeping the hue. */
  --crit:#b3341f; --imp:#8a5a15; --minor:#6e6a63;
  --ok:#1c6b45; --warn:#9a6a12; --bad:#7a3f96;
  --factbg:#f4f2ec;
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#14140f; --card:#1c1c18; --ink:#eae7df; --ink2:#c9c5bb; --muted:#928e85;
  --line:#2c2b26; --line2:#3a3833; --accent:#d9a066;
  --crit:#ff7a63; --imp:#e3a94f; --minor:#7d7a72;
  --ok:#5fc999; --warn:#e0bb5c; --bad:#c58ede;
  --factbg:#232320;
}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);
 font-family:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
 line-height:1.65;-webkit-font-smoothing:antialiased;
 /* Fluid base size: 15.5px on a small phone up to 17px on a desktop, so the
    measure stays readable without a stack of breakpoints. */
 font-size:clamp(15.5px, 0.95rem + 0.18vw, 17px)}

/* Measure, not pixels. ~55 cpl gave the best comprehension in Dyson &
   Haselgrove and read FASTER than short lines; the usable band is 45-75 and
   should not pass ~70. 64ch on the body font lands mid-band. */
.wrap{margin:0 auto;
 padding:clamp(18px, 4vw, 34px) clamp(14px, 4vw, 20px) 100px;
 /* `min(64ch + 4rem, ...)` silently does nothing — an addition inside min()
    needs calc(). The first attempt measured 81 characters per line, past the
    45-75 band entirely. */
 max-width:min(calc(54ch + 3rem), 38.5rem)}
main, header, .controls{max-width:100%}

/* Never let a long URL, code span or unbroken token push the page sideways. */
h3, .body, .deck, ul.facts li, .why{overflow-wrap:break-word}

header{margin-bottom:22px}
.brand{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
h1{margin:0;font-family:"Newsreader",Georgia,serif;font-weight:600;
 letter-spacing:-.015em;font-size:clamp(24px, 5vw, 31px)}
.meta{color:var(--muted);font-size:13.5px;line-height:1.6}
.meta .sep2{opacity:.7;margin:0 2px}
.meta .tzn{opacity:.9}
.meta span[title]{cursor:help}
.stale{margin-top:12px;padding:9px 13px;border-radius:8px;font-size:13px;
 background:color-mix(in srgb, var(--imp) 16%, transparent);
 color:var(--ink);border:1px solid color-mix(in srgb, var(--imp) 40%, transparent)}
@media (max-width:600px){
  .brand{gap:4px}
  .meta{font-size:12.5px}
  /* Measured: header 276px + controls 329px put the first headline at y=766
     of an 812px screen — the entire opening view was chrome and not one
     story was visible. The counts and the sort row are refinements, not
     entry points, so they fold away on a phone. */
  .stats{display:none}
  .lbl2, #sorts{display:none}
  header{margin-bottom:12px}
  .controls{padding:10px 0 8px}
  .tagbar{margin-top:8px}
  h1{font-size:22px}
}
.stats{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:12px;font-size:13.5px;
 color:var(--muted);padding-bottom:16px;border-bottom:1px solid var(--line)}
.stats b{color:var(--ink);font-weight:600}

/* controls — the bar retracts on scroll-down so it never sits over the text */
.controls{position:sticky;top:0;z-index:5;background:var(--bg);
 padding:14px 0 12px;border-bottom:1px solid var(--line);margin-bottom:6px;
 transition:transform .22s ease, opacity .22s ease}
.controls.hidden{transform:translateY(-115%);opacity:0;pointer-events:none}
.tagbar{display:flex;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap}
.toggle{border:1px solid var(--line2);background:transparent;color:var(--muted);
 border-radius:7px;padding:4px 11px;font-size:12.5px;cursor:pointer;
 font-family:inherit}
.toggle:hover{color:var(--ink);border-color:var(--muted)}
.toggle[aria-expanded=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.active-tags{display:flex;flex-wrap:wrap;gap:5px}
.active-tags .chip{background:var(--accent);color:var(--bg);border-color:var(--accent)}
#tagchips{margin-top:8px;max-height:0;overflow:hidden;
 transition:max-height .25s ease}
#tagchips.open{max-height:340px;overflow:auto}
#q{width:100%;padding:11px 14px;font:inherit;font-size:15.5px;color:var(--ink);
 background:var(--card);border:1px solid var(--line2);border-radius:9px}
#q:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
#q::placeholder{color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{border:1px solid var(--line2);background:transparent;color:var(--muted);
 border-radius:999px;padding:4px 11px;font-size:12.5px;cursor:pointer;
 font-family:inherit;line-height:1.5}
.chip:hover{color:var(--ink);border-color:var(--muted)}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
/* was opacity .55 -> 2.17:1, effectively invisible. */
.chip .n{opacity:.8;margin-left:5px;font-variant-numeric:tabular-nums}


/* sections */
h2.sec{font-family:"Newsreader",Georgia,serif;font-size:13px;letter-spacing:.13em;
 text-transform:uppercase;color:var(--muted);margin:38px 0 4px;font-weight:600;
 padding-bottom:8px;border-bottom:1px solid var(--line)}

/* card — an explicit type scale with real steps between layers.
   Layer-cake scanning only triggers when heading and body are UNMISTAKABLY
   different; layers within 2px of each other read as one grey block. */
article{padding:24px 0;border-bottom:1px solid var(--line)}
article:last-child{border-bottom:none}

/* Chips appear on exceptions only. Pennycook et al: labelling a subset makes
   the unlabelled subset read as verified, so a chip on every card is both
   decoration and a false claim about everything else. */
.rail{display:flex;flex-wrap:wrap;gap:7px;align-items:center;margin-bottom:8px}
.chip-crit,.chip-warn{font-size:10.5px;letter-spacing:.09em;font-weight:700;
 text-transform:uppercase;padding:2px 8px;border-radius:4px}
.chip-crit{background:var(--crit);color:var(--bg)}
.chip-warn{background:transparent;color:var(--warn);
 border:1px solid color-mix(in srgb, var(--warn) 55%, transparent)}

/* Layer 1 — headline. The only thing guaranteed to be read. */
h3{margin:0 0 9px;font-family:"Newsreader",Georgia,serif;
 font-size:clamp(19px, 3.2vw, 22px);
 line-height:1.3;font-weight:600;letter-spacing:-.012em}
h3 a{color:inherit;text-decoration:none}
h3 a:hover{text-decoration:underline;text-decoration-thickness:1px;
 text-underline-offset:3px}

/* Layer 2 — the deck. One framing line, not three. This is where readers
   stop, so it has to carry the concrete facts rather than an abstraction. */
.deck{font-size:15px;line-height:1.55;color:var(--ink2);margin:0 0 11px;
 font-weight:400}

/* Key facts are the default body now, not a decorative aside. Concrete
   specifics are what survives into memory. */
ul.facts{list-style:none;margin:0 0 12px;padding:0;display:grid;gap:5px}
ul.facts li{font-size:13.5px;line-height:1.5;color:var(--ink2);
 padding-left:15px;position:relative}
ul.facts li:before{content:"";position:absolute;left:0;top:.6em;
 width:4px;height:4px;border-radius:50%;background:var(--accent)}
ul.facts b{color:var(--ink);font-weight:600}

/* Behind disclosure: the prose summary and the audit trail. */
.body{font-family:"Newsreader",Georgia,serif;font-size:16px;line-height:1.7;
 color:var(--ink2);margin:10px 0 12px}
.why{font-size:13.5px;color:var(--muted);margin:0 0 12px;font-style:italic}

.tags{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:0}
.tag{background:transparent;border:1px solid var(--line2);color:var(--muted);
 font-size:11px;padding:2px 8px;border-radius:5px;cursor:pointer;
 font-family:inherit;letter-spacing:.02em}
.tag:hover{color:var(--accent);border-color:var(--accent)}

/* Named outlets, not a bare count: a single transparency feature moves
   nothing, concrete named indicators measurably raise trust. */
.srcs{display:flex;flex-wrap:wrap;gap:3px 8px;font-size:12.5px;
 align-items:baseline;margin-bottom:11px;color:var(--muted)}
.srcs a{color:var(--muted);text-decoration:none;border-bottom:1px solid var(--line2)}
.srcs a:hover{color:var(--ink);border-bottom-color:var(--muted)}
.srcs a.primary{color:var(--ok);border-bottom-color:var(--ok)}
.srcs .dot2{opacity:.4}
.srcs .more{opacity:.65}
.srcs .when{margin-left:auto;opacity:.8}

details{margin-top:12px}
summary{cursor:pointer;color:var(--muted);font-size:12.5px;list-style:none;
 display:inline-block}
summary::-webkit-details-marker{display:none}
summary:before{content:"\203A  ";display:inline-block;transition:transform .15s}
details[open] summary:before{transform:rotate(90deg)}
details ul{margin:9px 0 0;padding-left:19px;color:var(--muted);font-size:13px;
 line-height:1.6}

mark{background:color-mix(in srgb, var(--accent) 26%, transparent);
 color:inherit;padding:0 1px;border-radius:2px}

.loadmore{display:block;width:100%;margin:26px 0 0;padding:13px;
 border:1px solid var(--line2);background:transparent;color:var(--ink);
 border-radius:9px;font:inherit;font-size:14px;cursor:pointer}
.loadmore:hover{border-color:var(--muted);background:var(--card)}
.loadmore .rest{color:var(--muted);font-size:13px}

.empty{color:var(--muted);padding:60px 0;text-align:center;font-size:15px;
 line-height:2.2}

/* sort control + live result count */
.lbl2{font-size:11px;letter-spacing:.09em;text-transform:uppercase;
 color:var(--muted);font-weight:600}
#sorts{margin-top:0}
.count{font-size:12.5px;color:var(--muted);margin-left:auto}
h2.sec .win{font-weight:400;letter-spacing:0;text-transform:none;
 color:var(--muted);cursor:help;font-size:11.5px}

/* claims — the validation working, shown rather than asserted */
.claims{margin:9px 0 4px}
.claims > b{font-size:11px;letter-spacing:.07em;text-transform:uppercase;
 color:var(--muted);font-weight:600}
.claims ul{list-style:none;padding:0;margin:7px 0 0;display:grid;gap:6px}
.cl{display:grid;grid-template-columns:1.1em 1fr;gap:7px;font-size:13px;
 line-height:1.5;color:var(--muted)}
.ck{font-weight:700;text-align:center}
.cl.entailed .ck{color:var(--ok)}
.cl.contradicted .ck{color:var(--crit)}
.cl.contradicted{color:var(--ink)}
.cl.neutral .ck{color:var(--warn)}
details ul.tr{margin-top:10px}

/* keyboard focus must be visible — the site is navigable by j/k */
a:focus-visible, button:focus-visible, summary:focus-visible,
input:focus-visible{outline:2px solid var(--accent);outline-offset:2px;
 border-radius:4px}
article.cursor{box-shadow:-14px 0 0 -11px var(--accent)}
.skip{position:absolute;left:-9999px;top:0;background:var(--ink);
 color:var(--bg);padding:9px 14px;border-radius:0 0 8px 0;z-index:20}
.skip:focus{left:0}
kbd{font:inherit;font-size:.86em;border:1px solid var(--line2);
 border-bottom-width:2px;border-radius:4px;padding:0 4px;color:var(--ink)}

@media print{
  .controls,.skip,.stats,footer details{display:none !important}
  body{font-size:11pt;background:#fff;color:#000}
  .wrap{max-width:none;padding:0}
  article{page-break-inside:avoid;border-bottom:1px solid #ccc}
  .srcs a:after{content:" (" attr(href) ")";font-size:9pt;color:#555}
  details{display:none}
}

/* --- Small screens ---------------------------------------------------- */
@media (max-width:600px){
  /* Chips become finger-sized. 32px is the practical floor for a tap target
     that sits in a wrapping row. */
  .chip,.toggle{padding:7px 13px;font-size:13px;min-height:32px}
  /* Measured at 23.3px and 20.6px — both under the 24px WCAG 2.5.8 floor,
     and they are the smallest targets on the page. */
  .srcs a{min-height:32px;display:inline-flex;align-items:center}
  summary{min-height:32px;display:inline-flex;align-items:center}
  .tag{padding:5px 10px;font-size:12px;min-height:30px}
  /* The stats row wraps to two lines on a phone; tighten it so the header
     does not eat half the first screen. */
  .stats{gap:4px 12px;font-size:12.5px}
  article{padding:22px 0}
  .facts{padding:12px 14px}
  /* A retracting bar is more disruptive on a short viewport than a static
     one, so on phones it simply scrolls away with the page. */
  .controls{position:static}
  .controls.hidden{transform:none;opacity:1;pointer-events:auto}
  #tagchips.open{max-height:210px}
}

/* --- Tablet ----------------------------------------------------------- */
@media (min-width:601px) and (max-width:900px){
  .wrap{max-width:100%;padding-left:clamp(20px,5vw,44px);
        padding-right:clamp(20px,5vw,44px)}
}

/* Respect a reduced-motion preference: the retracting bar is decoration. */
@media (prefers-reduced-motion:reduce){
  *{transition:none !important;scroll-behavior:auto !important}
}
footer{margin-top:50px;padding-top:18px;border-top:1px solid var(--line);
 color:var(--muted);font-size:12.5px;line-height:1.7}
footer dl{margin:12px 0 0;display:grid;grid-template-columns:auto 1fr;
 gap:7px 14px;align-items:baseline}
footer dt{font-weight:600;color:var(--ink);white-space:nowrap}
footer dd{margin:0}
footer p{margin:14px 0 0}
@media (max-width:600px){
  footer dl{grid-template-columns:1fr;gap:2px}
  footer dd{margin:0 0 8px}
}
.stats span[title]{cursor:help;border-bottom:1px dotted var(--line2)}
</style>
</head>
<body>
<a class="skip" href="#feed">Skip to stories</a>
<div class="wrap">
  <header>
    <div class="brand"><h1>Newsdesk</h1><span class="meta" id="meta">loading…</span></div>
    <div class="stats" id="stats"></div>
  </header>

  <div class="controls">
    <input id="q" type="search" autocomplete="off" spellcheck="false"
           placeholder="Search — try dfir, soc, llm, cve, ransomware, a vendor name…">
    <div class="chips" id="cats"></div>
    <div class="tagbar">
      <span class="lbl2">Sort</span>
      <div class="chips" id="sorts"></div>
      <span class="count" id="count" aria-live="polite"></span>
    </div>
    <div class="tagbar">
      <button class="toggle" id="tagToggle" aria-expanded="false">Tags</button>
      <div class="active-tags" id="activeTags"></div>
    </div>
    <div class="chips" id="tagchips"></div>
  </div>

  <main id="feed"></main>
  <footer id="foot"></footer>
</div>

<script>
const CATS = {cyber_attacks:"Attacks & Exploits", cyber_tools:"Tools & Tradecraft",
              tech_ai:"Tech & AI", markets:"Markets", india_world:"India & World",
              cybersecurity:"Cybersecurity"};

// Section order was a byproduct of JS object key-insertion order, so whichever
// category happened to own the highest-scoring item led the page — a security
// reader could open to Markets, and the order changed day to day. Fixed.
const CAT_ORDER = ["cyber_attacks","cyber_tools","tech_ai","markets","india_world"];
const catRank = c => { const i = CAT_ORDER.indexOf(c); return i < 0 ? 99 : i; };
// Wording matters here: the badge answers "how well established is this",
// which is a different question from "how many outlets", already shown
// beside it. "unverified" means a single tier-C source, not "probably false".
const VD = {verified:"verified", corroborated:"corroborated",
            established:"established", unverified:"unverified",
            disputed:"disputed"};
let DATA=null, cat="all", activeTags=new Set(), query="", sort="priority";

// Show 12, then let the reader ask for more. Choice-overload work shows
// satisfaction down and deferral up as options multiply, and F-pattern
// fixation decays down a long list, so cards 13-40 are barely seen anyway.
// Explicit paging also preserves positional memory ("near the bottom of the
// first screen") that infinite scroll destroys.
const PAGE = 12;
let shown = PAGE;

// --- shareable state ---------------------------------------------------
// Filters live in the URL hash so a filtered view can be bookmarked, shared
// or survive a refresh. Without this, "look at the dfir items" means telling
// someone which chips to click.
function readState(){
  const h=new URLSearchParams(location.hash.slice(1));
  cat=h.get("cat")||"all";
  sort=h.get("sort")||"priority";
  query=(h.get("q")||"").toLowerCase();
  activeTags=new Set((h.get("tags")||"").split(",").filter(Boolean));
}
function writeState(){
  const h=new URLSearchParams();
  if(cat!=="all") h.set("cat",cat);
  if(sort!=="priority") h.set("sort",sort);
  if(query) h.set("q",query);
  if(activeTags.size) h.set("tags",[...activeTags].join(","));
  const s=h.toString();
  // replaceState, not a hash assignment: this must not add a history entry
  // for every keystroke in the search box.
  history.replaceState(null,"",s?("#"+s):location.pathname);
}

const SORTS={
  priority:{label:"Priority", fn:(a,b)=>
    (PRI[a.priority]-PRI[b.priority]) || (b.blend-a.blend)},
  newest:{label:"Newest", fn:(a,b)=>
    new Date(b.published||0)-new Date(a.published||0)},
  sources:{label:"Most sources", fn:(a,b)=>
    (b.corroboration-a.corroboration) || (PRI[a.priority]-PRI[b.priority])},
};
const PRI={critical:0, important:1, minor:2};

const esc = s => String(s==null?"":s).replace(/[&<>"']/g,
  c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function ago(iso){
  if(!iso) return "";
  const h=(Date.now()-new Date(iso))/36e5;
  if(h<1) return Math.max(1,Math.round(h*60))+"m ago";
  if(h<24) return Math.round(h)+"h ago";
  return Math.round(h/24)+"d ago";
}

// Highlight matches, but only after escaping — never build HTML from raw input.
function hl(text){
  const safe = esc(text);
  if(!query) return safe;
  const terms = query.split(/\s+/).filter(t=>t.length>1)
    .map(t=>t.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"));
  if(!terms.length) return safe;
  return safe.replace(new RegExp("("+terms.join("|")+")","ig"), "<mark>$1</mark>");
}

// "Label: value" renders the label in bold; plain strings pass through.
function fact(f){
  const i = f.indexOf(":");
  if(i>0 && i<42) return "<b>"+hl(f.slice(0,i))+"</b>"+hl(f.slice(i));
  return hl(f);
}

function haystack(it){
  return [it.title, it.summary, it.bottom_line, it.one_liner,
          (it.key_facts||[]).join(" "), (it.tags||[]).join(" "),
          it.sources.map(s=>s.name).join(" ")].join(" ").toLowerCase();
}

function matches(it){
  if(cat!=="all" && it.category!==cat) return false;
  for(const t of activeTags) if(!(it.tags||[]).includes(t)) return false;
  if(!query) return true;
  const hay = haystack(it);
  return query.split(/\s+/).filter(Boolean).every(t=>hay.includes(t));
}

function card(it){
  // Card structure follows the evidence, not taste:
  //
  //  * TWO framing layers, not four. Chandler & Sweller's redundancy effect
  //    says that when several sources are each independently intelligible,
  //    showing them all forces mental reconciliation and produces WORSE
  //    learning than showing one. Headline + one deck is also the journalism
  //    standfirst convention NN/g endorse unchanged for the web.
  //  * Key facts are the DEFAULT body; the prose summary moves behind
  //    disclosure. Readers stop at layer two believing they are informed
  //    (the "illusion of knowledge" finding), so layer two must carry the
  //    concrete numbers rather than an abstract significance claim.
  //  * Badges only for exceptions. Pennycook et al. showed labelling a
  //    subset makes the UNLABELLED subset read as verified, so a chip on
  //    every card is both decoration and a lie about everything else.
  const byName=new Map();
  for(const s of it.sources) if(!byName.has(s.name)) byName.set(s.name,s);
  const named=[...byName.values()];

  // Two named outlets beat a bare count: the Trust Project work found a
  // SINGLE transparency feature moves nothing, while concrete named
  // indicators measurably raised trust. Same width, real information.
  const shown=named.slice(0,2).map(s=>
    '<a href="'+esc(s.url)+'" target="_blank" rel="noopener">'+esc(s.name)+'</a>');
  // Count what is actually listed. The rail used to print `corroboration`,
  // which counts INDEPENDENT outlets after syndication collapsing, while the
  // row below listed every distinct name — so a card could read "3 outlets"
  // above six links. A reader who checks stops trusting every number.
  const more=named.length>2 ? '<span class="more">+'+(named.length-2)+'</span>' : "";
  const prim=(it.primary_links||[]).length
    ? '<a class="primary" href="'+esc(it.primary_links[0])+
      '" target="_blank" rel="noopener">primary source</a>' : "";

  // At most three facts. Concreteness aids recall; a long list stops being
  // scannable and becomes another wall of text.
  const facts=(it.key_facts||[]).slice(0,3);
  const factHtml=facts.length
    ? '<ul class="facts">'+facts.map(f=>"<li>"+fact(f)+"</li>").join("")+"</ul>" : "";

  const tags=(it.tags||[]).slice(0,5);
  const tagHtml=tags.length
    ? '<div class="tags">'+tags.map(t=>
      '<button class="tag" data-tag="'+esc(t)+'">'+esc(t)+"</button>").join("")+"</div>" : "";

  const trace=(it.trace||[]).map(t=>"<li>"+esc(t)+"</li>").join("");
  const CLAIM_MARK={entailed:"✓", contradicted:"✗", neutral:"?"};
  const claims=(it.claims||[]).map(c=>
    '<li class="cl '+esc(c.status||"unchecked")+'">'+
    '<span class="ck">'+(CLAIM_MARK[c.status]||"·")+'</span>'+
    esc(c.text)+'</li>').join("");

  // Only the exceptions get a chip. "important" is the unlabelled default.
  const pri = it.priority==="critical"
    ? '<span class="chip-crit">critical</span>' : "";
  const vd = (it.verdict==="unverified"||it.verdict==="disputed")
    ? '<span class="chip-warn">'+esc(VD[it.verdict]||it.verdict)+'</span>' : "";

  const detail =
    (it.summary?'<p class="body">'+hl(it.summary)+'</p>':"")+
    (it.one_liner?'<p class="why">'+hl(it.one_liner)+'</p>':"")+
    (claims?'<div class="claims"><b>Claims checked against the source</b><ul>'+
      claims+'</ul></div>':"")+
    (trace?'<ul class="tr">'+trace+'</ul>':"");

  return '<article class="'+esc(it.priority)+'">'+
    (pri||vd ? '<div class="rail">'+pri+vd+'</div>' : "")+
    '<h3><a href="'+esc(it.sources[0].url)+'" target="_blank" rel="noopener">'+
      hl(it.title)+'</a></h3>'+
    (it.bottom_line?'<p class="deck">'+hl(it.bottom_line)+'</p>':"")+
    factHtml+
    '<div class="srcs">'+shown.join('<span class="dot2">·</span>')+more+prim+
      (band(it.published)?'<span class="when">'+esc(band(it.published))+'</span>':"")+
    '</div>'+
    tagHtml+
    (detail?'<details><summary>Full summary and how it was checked</summary>'+
      detail+'</details>':"")+
  '</article>';
}

// Recency as a coarse band, in the metadata row rather than beside the
// badges — it is scent, not a warning, and it must not compete with the
// headline for the first fixation.
function band(iso){
  if(!iso) return "";
  const h=(Date.now()-new Date(iso))/36e5;
  if(h<1) return "just now";
  if(h<6) return Math.round(h)+"h";
  if(h<24) return "today";
  if(h<48) return "yesterday";
  return Math.round(h/24)+" days";
}

function draw(){
  const feed=document.getElementById("feed");
  const items=DATA.items.filter(matches).sort(SORTS[sort].fn);

  writeState();
  const live=document.getElementById("count");
  if(live) live.textContent =
    items.length+" of "+DATA.items.length+" stories"+
    (sort!=="priority" ? ", by "+SORTS[sort].label.toLowerCase() : "");

  if(!items.length){
    feed.innerHTML='<p class="empty">Nothing matches.'+
      (query?' No story mentions &ldquo;'+esc(query)+'&rdquo;.':'')+
      '<br><button class="chip" id="clearAll">Clear all filters</button></p>';
    const btn=document.getElementById("clearAll");
    if(btn) btn.onclick=()=>{
      cat="all"; activeTags.clear(); query="";
      document.getElementById("q").value="";
      syncChips(); draw();
    };
    drawTags(items); return;
  }

  const page=items.slice(0, shown);

  // Sorting by time or source count deliberately drops the category
  // headings — grouping fights the ordering the reader just asked for.
  let html;
  if(sort==="priority"){
    const groups={};
    for(const it of page){ (groups[it.category]=groups[it.category]||[]).push(it); }
    html=Object.keys(groups).sort((a,b)=>catRank(a)-catRank(b)).map(c=>
      '<h2 class="sec">'+esc(CATS[c]||c)+' &middot; '+groups[c].length+
      windowNote(c)+'</h2>'+
      groups[c].map(card).join("")).join("");
  }else{
    html=page.map(card).join("");
  }

  if(items.length>shown){
    html+='<button class="loadmore" id="loadmore">Show '+
      Math.min(PAGE, items.length-shown)+' more'+
      '<span class="rest"> &middot; '+(items.length-shown)+' remaining</span></button>';
  }
  feed.innerHTML=html;

  const lm=document.getElementById("loadmore");
  if(lm) lm.onclick=()=>{
    const first=shown;            // keep the reader's place
    shown+=PAGE; draw();
    const cards=document.querySelectorAll("article");
    if(cards[first]) cards[first].scrollIntoView({block:"start",behavior:"smooth"});
  };
  drawTags(items);
}

// Sections use different lookback windows — 48h for news, 7 days for tools,
// because research blogs publish weekly. Saying so stops a 5-day-old tools
// item reading as staleness.
function windowNote(catKey){
  const h=(DATA.per_category_hours||{})[catKey];
  if(!h) return "";
  const label = h>=48 ? Math.round(h/24)+" days" : h+"h";
  return ' <span class="win" title="This section looks back '+label+
         ', because its sources publish less often">last '+label+'</span>';
}

// Tag chips reflect what is actually on screen, so the facets never offer a
// filter that would return nothing.
function drawTags(visible){
  const counts={};
  for(const it of DATA.items){
    if(cat!=="all" && it.category!==cat) continue;
    for(const t of it.tags||[]) counts[t]=(counts[t]||0)+1;
  }
  const ordered=Object.entries(counts).sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0]));
  const box=document.getElementById("tagchips");
  const toggle=document.getElementById("tagToggle");
  if(toggle) toggle.textContent = activeTags.size
    ? "Tags · "+activeTags.size+" on" : "Tags";

  // Active filters stay visible next to the toggle even when the drawer is
  // shut, so you can always see and undo what is filtering the page.
  const act=document.getElementById("activeTags");
  if(act) act.innerHTML=[...activeTags].map(t=>
    '<button class="chip" data-tag="'+esc(t)+'">'+esc(t)+' ×</button>').join("");

  box.innerHTML=ordered.map(([t,n])=>
    '<button class="chip" data-tag="'+esc(t)+'" aria-pressed="'+activeTags.has(t)+'">'+
    esc(t)+'<span class="n">'+n+'</span></button>').join("");
}

// All times render in the READER's timezone, resolved from the browser rather
// than assumed. The stored values are UTC ISO8601, so this is a display
// concern only — a page opened in a different country still reads correctly.
function fmt(iso){
  const d=new Date(iso);
  return d.toLocaleString(undefined,
    {weekday:"short", day:"numeric", month:"short",
     hour:"2-digit", minute:"2-digit"});
}

function until(iso){
  const mins=Math.round((new Date(iso)-Date.now())/6e4);
  if(mins<=0) return "due now";
  if(mins<60) return "in "+mins+" min";
  const h=Math.floor(mins/60), m=mins%60;
  if(h<24) return "in "+h+"h"+(m?" "+m+"m":"");
  return "in "+Math.round(h/24)+"d";
}

function updateLine(d){
  const tz=Intl.DateTimeFormat().resolvedOptions().timeZone||"local time";
  const age=ago(d.generated_at);
  let out='<span title="'+esc(new Date(d.generated_at).toISOString())+'">'+
          "Updated "+esc(age)+" &middot; "+esc(fmt(d.generated_at))+"</span>";
  if(d.next_update){
    out+=' <span class="sep2">|</span> <span title="'+
         esc(new Date(d.next_update).toISOString())+'">Next update '+
         esc(until(d.next_update))+" &middot; "+esc(fmt(d.next_update));
    if(d.schedule && d.schedule.display_name)
      out+=" ("+esc(d.schedule.display_name)+" daily)";
    out+="</span>";
  }
  out+=' <span class="sep2">|</span> <span class="tzn">times in '+esc(tz)+"</span>";
  return out;
}

function boot(d){
  DATA=d;
  readState();
  document.getElementById("q").value = query;
  const c=d.counts;
  document.getElementById("meta").innerHTML=updateLine(d);
  // Plain language, and only counts that are actually meaningful. "Blocked at
  // the gate" was internal jargon that meant nothing to a reader.
  const stat=(n,label,title)=>
    '<span title="'+esc(title)+'"><b>'+n+'</b> '+label+'</span>';
  document.getElementById("stats").innerHTML=
    stat(c.published,"stories","Stories published on this page")+
    stat(c.critical,"need attention","Highest priority — worth acting on today")+
    stat(c.verified||0,"verified",
         "Backed by an official source (CISA, a CVE record, a vendor advisory) "
         +"or reported independently by 3+ outlets")+
    stat(c.corroborated||0,"corroborated",
         "Two independent outlets report the same story")+
    stat(c.rejected,"not published",
         "Refused before publishing: either too old for the window, or a "
         +"sentence in the summary could not be traced back to the source "
         +"article. Logged with reasons in data/rejected.json.");

  const cats=["all",...new Set(d.items.map(i=>i.category))];
  const cbox=document.getElementById("cats");
  cbox.innerHTML=cats.map(x=>{
    const n=x==="all"?d.items.length:d.items.filter(i=>i.category===x).length;
    // esc() even though categories come from our own config: an unescaped
    // value inside an attribute is an injection waiting for the day the data
    // source changes.
    return '<button class="chip" data-cat="'+esc(x)+'" aria-pressed="'+(x===cat)+'">'+
      (x==="all"?"All":esc(CATS[x]||x))+'<span class="n">'+n+'</span></button>';
  }).join("");

  cbox.onclick=e=>{
    const b=e.target.closest("button[data-cat]"); if(!b) return;
    cat=b.dataset.cat; activeTags.clear();
    shown=PAGE;
    [...cbox.children].forEach(x=>x.setAttribute("aria-pressed",x===b));
    draw();
  };
  document.getElementById("tagchips").onclick=e=>{
    const b=e.target.closest("button[data-tag]"); if(!b) return;
    const t=b.dataset.tag;
    activeTags.has(t)?activeTags.delete(t):activeTags.add(t);
    shown=PAGE;
    draw();
  };
  document.getElementById("activeTags").onclick=e=>{
    const b=e.target.closest("button[data-tag]"); if(!b) return;
    activeTags.delete(b.dataset.tag); draw();
  };

  // The tag list is long enough to bury the article underneath it, so it is
  // collapsed by default and opened on demand.
  const drawer=document.getElementById("tagchips");
  const toggle=document.getElementById("tagToggle");
  toggle.onclick=()=>{
    const open=drawer.classList.toggle("open");
    toggle.setAttribute("aria-expanded", open);
  };

  // Retract the whole control bar while scrolling down, bring it back on the
  // way up — the reading area is never covered by chrome you are not using.
  const bar=document.querySelector(".controls");
  let lastY=window.scrollY, ticking=false;
  window.addEventListener("scroll",()=>{
    if(ticking) return;
    ticking=true;
    requestAnimationFrame(()=>{
      const y=window.scrollY;
      const goingDown = y>lastY && y>140;
      // Never hide the bar while a filter is open or focused, or the control
      // vanishes mid-interaction.
      const busy = drawer.classList.contains("open") ||
                   document.activeElement===document.getElementById("q");
      bar.classList.toggle("hidden", goingDown && !busy);
      lastY=y; ticking=false;
    });
  },{passive:true});
  document.getElementById("feed").addEventListener("click",e=>{
    const b=e.target.closest("button.tag"); if(!b) return;
    activeTags.clear(); activeTags.add(b.dataset.tag);
    window.scrollTo({top:0,behavior:"smooth"}); draw();
  });

  let timer;
  document.getElementById("q").addEventListener("input",e=>{
    clearTimeout(timer);
    timer=setTimeout(()=>{ query=e.target.value.trim().toLowerCase(); draw(); },110);
  });

  // --- sort control ----------------------------------------------------
  const sbox=document.getElementById("sorts");
  sbox.innerHTML=Object.entries(SORTS).map(([k,v])=>
    '<button class="chip" data-sort="'+k+'" aria-pressed="'+(k===sort)+'">'+
    esc(v.label)+'</button>').join("");
  sbox.onclick=e=>{
    const b=e.target.closest("button[data-sort]"); if(!b) return;
    sort=b.dataset.sort;
    shown=PAGE;
    [...sbox.children].forEach(x=>x.setAttribute("aria-pressed",x===b));
    draw();
  };

  // --- keyboard navigation ---------------------------------------------
  // This is a reading site, so moving between stories should not require the
  // mouse. j/k mirror the convention every feed reader already uses.
  let cursor=-1;
  const cards=()=>[...document.querySelectorAll("article")];
  function focusCard(n){
    const all=cards(); if(!all.length) return;
    cursor=Math.max(0,Math.min(n,all.length-1));
    all.forEach(c=>c.classList.remove("cursor"));
    const el=all[cursor];
    el.classList.add("cursor");
    el.scrollIntoView({block:"center",behavior:"smooth"});
  }
  document.addEventListener("keydown",e=>{
    const typing = /^(INPUT|TEXTAREA)$/.test(e.target.tagName);
    if(e.key==="/" && !typing){
      e.preventDefault(); document.getElementById("q").focus(); return;
    }
    if(e.key==="Escape"){
      if(typing){ e.target.blur(); }
      else if(query||activeTags.size||cat!=="all"){
        cat="all"; activeTags.clear(); query="";
        document.getElementById("q").value=""; syncChips(); draw();
      }
      return;
    }
    if(typing || e.metaKey || e.ctrlKey || e.altKey) return;
    if(e.key==="j"){ e.preventDefault(); focusCard(cursor+1); }
    else if(e.key==="k"){ e.preventDefault(); focusCard(cursor-1); }
    else if(e.key==="o"||e.key==="Enter"){
      const el=cards()[cursor]; const a=el&&el.querySelector("h3 a");
      if(a) window.open(a.href,"_blank","noopener");
    }
    else if(e.key==="?"){
      const h=document.getElementById("help");
      if(h) h.open=!h.open;
    }
  });

  // Keep the chip rows in step with state restored from the URL.
  function syncChips(){
    [...document.getElementById("cats").children].forEach(x=>
      x.setAttribute("aria-pressed", x.dataset.cat===cat));
    [...sbox.children].forEach(x=>
      x.setAttribute("aria-pressed", x.dataset.sort===sort));
  }
  window.syncChips=syncChips;
  syncChips();

  // If a scheduled run has clearly been missed, say so rather than showing a
  // confidently stale page — the reader cannot tell the difference otherwise.
  if(d.next_update){
    const overdueHrs=(Date.now()-new Date(d.next_update))/36e5;
    if(overdueHrs>1){
      const w=document.createElement("div");
      w.className="stale";
      w.textContent="This page is overdue by "+Math.round(overdueHrs)+
        "h — the scheduled update has not run. Content below may be out of date.";
      document.querySelector("header").appendChild(w);
    }
  }

  document.getElementById("foot").innerHTML=
    '<details id="help"><summary>Keyboard shortcuts</summary>'+
    '<dl><dt><kbd>j</kbd> / <kbd>k</kbd></dt><dd>next / previous story</dd>'+
    '<dt><kbd>o</kbd> or <kbd>Enter</kbd></dt><dd>open the highlighted story</dd>'+
    '<dt><kbd>/</kbd></dt><dd>jump to search</dd>'+
    '<dt><kbd>Esc</kbd></dt><dd>clear all filters</dd>'+
    '<dt><kbd>?</kbd></dt><dd>this list</dd></dl></details>'+
    '<details><summary>What do these labels mean?</summary>'+
    '<dl>'+
    '<dt>verified</dt><dd>Traced to an official artifact — a CISA advisory, a '+
      'CVE record, a vendor security bulletin — or independently reported by '+
      'three or more outlets.</dd>'+
    '<dt>corroborated</dt><dd>Two independent outlets report it. Syndicated '+
      'copies of one wire story count as one outlet, not two.</dd>'+
    '<dt>established</dt><dd>A single outlet, but a known publication.</dd>'+
    '<dt>unverified</dt><dd>A single blog, repository or aggregator. Shown, '+
      'but treat it as one person&#39;s word.</dd>'+
    '<dt>disputed</dt><dd>Sources disagree, or a second model could not '+
      'confirm a claim against the source text.</dd>'+
    '<dt>not published</dt><dd>Refused before reaching this page — too old '+
      'for its section&#39;s window, or a sentence in the summary could not '+
      'be traced back to the article it came from. Every rejection is logged '+
      'with its reason.</dd>'+
    '</dl>'+
    '<p>These labels describe <em>sourcing</em>, not proven truth. '+
    '&ldquo;Verified&rdquo; means well attested, not guaranteed correct.</p>'+
    '</details>';
  draw();
}

fetch("news.json",{cache:"no-store"})
  .then(r=>{if(!r.ok)throw new Error("HTTP "+r.status);return r.json();})
  .then(boot)
  .catch(e=>{
    document.getElementById("meta").textContent="could not load news.json — "+e;
    document.getElementById("feed").innerHTML=
      '<p class="empty">Run <code>python run.py</code> first.</p>';
  });
</script>
</body>
</html>
